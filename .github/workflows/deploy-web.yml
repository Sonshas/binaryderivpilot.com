name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "deploy/vultr/activate-release.sh"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production web
        working-directory: apps/web
        env:
          VITE_E2E_AUTH_BYPASS: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_ACCOUNT_NAME: ${{ secrets.VITE_DEMO_ACCOUNT_NAME }}
          VITE_REAL_ACCOUNT_NAME: ${{ secrets.VITE_REAL_ACCOUNT_NAME }}
          VITE_DEMO_ACCOUNT_SHORT: ${{ secrets.VITE_DEMO_ACCOUNT_SHORT }}
          VITE_REAL_ACCOUNT_SHORT: ${{ secrets.VITE_REAL_ACCOUNT_SHORT }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_MARKET_DATA_PROVIDER: ${{ secrets.VITE_MARKET_DATA_PROVIDER }}
          VITE_DERIV_APP_ID: ${{ secrets.VITE_DERIV_APP_ID }}
          VITE_MARKET_DATA_WS_URL: ${{ secrets.VITE_MARKET_DATA_WS_URL }}
          VITE_MARKET_DATA_API_URL: ${{ secrets.VITE_MARKET_DATA_API_URL }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
          VITE_VIP_EMAILS: ${{ secrets.VITE_VIP_EMAILS }}
        run: npm run build

      - name: Reject auth-bypass in bundle
        run: |
          if grep -R -F -e 'E2E auth bypass' -e 'VITE_E2E_AUTH_BYPASS:`true`' apps/web/dist; then
            echo 'Production bundle still contains the E2E auth bypass.' >&2
            exit 1
          fi
          test -f apps/web/dist/index.html

      - name: Configure SSH
        env:
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VULTR_HOST" >> ~/.ssh/known_hosts

      - name: Upload release and activate
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
          KEEP_RELEASES: "5"
        run: |
          set -euo pipefail
          SITE_ROOT=/var/www/binaryderivpilot
          RELEASE="$(date -u +%Y%m%d-%H%M%S)"
          TARGET="${VULTR_SSH_USER}@${VULTR_HOST}"
          SSH=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)

          "${SSH[@]}" "$TARGET" "mkdir -p ${SITE_ROOT}/releases"
          "${SCP[@]}" -r apps/web/dist "${TARGET}:${SITE_ROOT}/releases/${RELEASE}"
          "${SCP[@]}" deploy/vultr/activate-release.sh "${TARGET}:/tmp/activate-release.sh"
          "${SSH[@]}" "$TARGET" "bash /tmp/activate-release.sh '${SITE_ROOT}' '${RELEASE}' '${KEEP_RELEASES}'"
          echo "Deployed release ${RELEASE} to https://binaryderivpilot.com"
